name: reconcile-v2-catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-v2-catalog.yml'
      - 'tools/index_run_manifest.py'
      - 'tools/manifest_policy.py'
      - 'tools/check_dataset_quality.py'
      - 'tests/test_dataset_policy.py'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset-v2-control-plane-index
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout dataset control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all production V2 run manifests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v2-release-manifests"
          mkdir -p "$ROOT"
          COUNT=0

          while IFS= read -r TAG; do
            [ -n "$TAG" ] || continue
            case "$TAG" in
              data-v2-*|copy-vault-v2-*) ;;
              *) continue ;;
            esac

            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY"               --json assets --jq '.assets[].name' 2>/dev/null               | grep -Fxq 'RUN_MANIFEST.json'; then
              echo "skip incomplete release: $TAG"
              continue
            fi

            DEST="$ROOT/$TAG"
            mkdir -p "$DEST"
            gh release download "$TAG"               --repo "$GITHUB_REPOSITORY"               --pattern 'RUN_MANIFEST.json'               --dir "$DEST"
            COUNT=$((COUNT + 1))
          done < <(
            gh release list               --repo "$GITHUB_REPOSITORY"               --limit 1000               --json tagName               --jq '.[].tagName'
          )

          echo "RUN_MANIFEST_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "production run manifests found: $COUNT"

      - name: Rebuild control-plane index from verified production releases
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t MANIFESTS < <(
            find "$RUNNER_TEMP/v2-release-manifests"               -name RUN_MANIFEST.json -type f | sort
          )
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "No production manifests downloaded."
            exit 0
          fi
          python tools/index_run_manifest.py "${MANIFESTS[@]}"

      - name: Validate rebuilt control plane
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_dataset_quality.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests

      - name: Commit reconciled catalog
        if: env.RUN_MANIFEST_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog datasets
          if git diff --cached --quiet; then
            echo "Catalog already reconciled."
            exit 0
          fi
          git commit -m "data: reconcile V2 catalog from production releases"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to publish reconciled V2 catalog."
          exit 1
