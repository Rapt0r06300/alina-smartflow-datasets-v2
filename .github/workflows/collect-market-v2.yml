name: collect-market-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-market-v2.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      duration_s:
        description: Collection seconds per batch
        required: false
        default: '11400'
      max_coins:
        description: Maximum multi-venue coins
        required: false
        default: '60'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
      collector_sha: ${{ steps.code.outputs.sha }}
    steps:
      - name: Checkout Alina code
        uses: actions/checkout@v4
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: main
          path: alina
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install collector
        run: python -m pip install --disable-pip-version-check -e ./alina

      - id: code
        name: Pin collector SHA
        run: echo "sha=$(git -C alina rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Discover exact multi-venue universe
        env:
          MAX_COINS: ${{ github.event_name == 'push' && '4' || inputs.max_coins || '60' }}
        run: |
          python alina/tools/discover_cloud_collection_plan.py             --output /tmp/collection-plan.json             --min-venues 2             --max-coins "$MAX_COINS"             --batch-size 4
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("/tmp/collection-plan.json", encoding="utf-8"))
          batches = [
              {"batch_id": row["batch_id"], "coins": row["coins"]}
              for row in plan["batches"]
          ]
          print("batches=" + json.dumps(batches, separators=(",", ":")))
          PY

  collect:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        batch: ${{ fromJSON(needs.discover.outputs.batches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_SHA: ${{ needs.discover.outputs.collector_sha }}
      COLLECTION_RUN_ID: market-${{ github.run_id }}
      DURATION_S: ${{ github.event_name == 'push' && '60' || inputs.duration_s || '11400' }}
      BATCH_JSON: ${{ toJSON(matrix.batch) }}
    steps:
      - name: Checkout Alina code
        uses: actions/checkout@v4
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: ${{ needs.discover.outputs.collector_sha }}
          path: alina
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install collector
        run: python -m pip install --disable-pip-version-check -e ./alina

      - name: Freeze this batch plan
        run: |
          python - <<'PY'
          import json, os
          batch = json.loads(os.environ["BATCH_JSON"])
          with open("/tmp/batch-plan.json", "w", encoding="utf-8") as handle:
              json.dump({"coins": batch["coins"]}, handle, indent=2)
          PY

      - name: Collect replay-grade market window
        env:
          ALINA_COLLECTION_RUN_ID: ${{ env.COLLECTION_RUN_ID }}
        run: |
          python alina/tools/collect_cloud_window.py             --output /tmp/alina-bundle             --plan-file /tmp/batch-plan.json             --duration-s "$DURATION_S"             --collector-version "$COLLECTOR_SHA"             --collection-run-id "$COLLECTION_RUN_ID"             --rotate-mb 256

      - name: Publish immutable V2 shards
        run: |
          python alina/tools/publish_dataset_v2_release.py /tmp/alina-bundle             --repository "${{ github.repository }}"             --tag "market-v2-${{ github.run_id }}-${{ matrix.batch.batch_id }}"             --target main             --title "Alina market V2 run ${{ github.run_id }} / ${{ matrix.batch.batch_id }}"

      - name: Final local summary
        if: always()
        run: |
          if [ -f /tmp/alina-bundle/collection_summary.json ]; then
            cat /tmp/alina-bundle/collection_summary.json
          fi
