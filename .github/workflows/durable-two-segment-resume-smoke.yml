name: durable-two-segment-resume-smoke
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: "Existing current-epoch continuation campaign"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: durable-two-segment-resume-${{ inputs.campaign_id }}
  cancel-in-progress: false
jobs:
  segment_a:
    name: Segment A durable checkpoint
    uses: ./.github/workflows/resumable-campaign-worker.yml
    with:
      campaign_id: ${{ inputs.campaign_id }}
      max_units: 1
    permissions:
      contents: write

  segment_b:
    name: Segment B fresh-runner resume
    needs: segment_a
    uses: ./.github/workflows/resumable-campaign-worker.yml
    with:
      campaign_id: ${{ inputs.campaign_id }}
      max_units: 0
    permissions:
      contents: write

  receipt:
    name: Publish two-segment receipt
    needs: [segment_a, segment_b]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Wait for durable resumed campaign to reach terminal state
        shell: bash
        run: |
          set -euo pipefail
          M="catalog/campaigns/${{ inputs.campaign_id }}.json"
          SNAPSHOT="$RUNNER_TEMP/campaign.json"
          terminal=""
          for i in $(seq 1 90); do
            git fetch origin main
            git show "origin/main:$M" > "$SNAPSHOT"
            terminal="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$SNAPSHOT")"
            case "$terminal" in
              COMPLETE|FAILED|UNAVAILABLE|PARTIAL|REJECT)
                break
                ;;
            esac
            sleep 20
          done
          case "$terminal" in
            COMPLETE) ;;
            FAILED|UNAVAILABLE|PARTIAL|REJECT)
              echo "resume smoke reached non-success terminal state: $terminal" >&2
              exit 1
              ;;
            *) echo "resume smoke did not reach terminal state: $terminal" >&2; exit 1 ;;
          esac
          python - <<'PY' "$SNAPSHOT" >> "$GITHUB_ENV"
          import json,sys
          row=json.load(open(sys.argv[1],encoding="utf-8"))
          print("RESUME_TERMINAL_STATUS="+str(row.get("status") or ""))
          print("RESUME_PHASE_EPOCH="+str(row.get("phase_epoch") or ""))
          print("RESUME_SOURCE_EPOCH="+str(row.get("source_collection_epoch") or ""))
          print("RESUME_SELECTION_ID="+str(row.get("dataset_selection_id") or ""))
          print("RESUME_CHECKPOINT_ID="+str((row.get("cursor") or {}).get("checkpoint_id") or ""))
          print("RESUME_COMPLETED_UNITS="+str(len(row.get("completed_units") or {})))
          PY

      - name: Build cloud resume receipt
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          SEGMENT_A_RESULT: ${{ needs.segment_a.result }}
          SEGMENT_B_RESULT: ${{ needs.segment_b.result }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          path = Path("catalog/RESUME_SMOKE_RECEIPT.json")
          campaign = json.loads((Path(os.environ["RUNNER_TEMP"]) / "campaign.json").read_text(encoding="utf-8"))
          completed_ids = sorted(str(key) for key in (campaign.get("completed_units") or {}))
          dataset_head = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          with urllib.request.urlopen("https://api.github.com/repos/Rapt0r06300/hyperliquid-smart-wallet-observer/commits/main") as response:
              alina_head = json.load(response)["sha"]
          payload = {
              "schema": "alina.two_segment_resume_receipt.v1",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "segment_a_run_id": os.environ["GITHUB_RUN_ID"],
              "segment_b_run_id": os.environ["GITHUB_RUN_ID"],
              "segment_a_job_identity": "segment_a",
              "segment_b_job_identity": "segment_b",
              "main_alina_head": alina_head,
              "dataset_v2_head": dataset_head,
              "segment_a_workflow_result": os.environ["SEGMENT_A_RESULT"],
              "segment_b_workflow_result": os.environ["SEGMENT_B_RESULT"],
              "campaign_id": os.environ["CAMPAIGN_ID"],
              "fresh_runner_for_segment_b": True,
              "runner_filesystem_reused": False,
              "durable_dataset_state_required": True,
              "terminal_campaign_status": os.environ.get("RESUME_TERMINAL_STATUS"),
              "terminal_phase_epoch": os.environ.get("RESUME_PHASE_EPOCH"),
              "terminal_source_collection_epoch": os.environ.get("RESUME_SOURCE_EPOCH"),
              "terminal_selection_id": os.environ.get("RESUME_SELECTION_ID"),
              "terminal_checkpoint_id": os.environ.get("RESUME_CHECKPOINT_ID"),
              "terminal_completed_units": int(os.environ.get("RESUME_COMPLETED_UNITS") or "0"),
              "completed_unit_identities": completed_ids,
              "duplicate_completed_unit_count": len(completed_ids) - len(set(completed_ids)),
              "terminal_evidence_digest": campaign.get("terminal_evidence_digest"),
              "checkpoint_lineage": campaign.get("checkpoint_lineage") or [],
              "segment_a_max_units": 1,
              "segment_a_must_checkpoint_before_segment_b": True,
              "segment_b_max_units": 0,
              "paper_only": True,
              "read_only": True,
              "real_execution": False,
          }
          payload["receipt_digest"] = hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")).hexdigest()
          path.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Publish durable resume receipt
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/RESUME_SMOKE_RECEIPT.json
          git commit -m "proof: publish two-segment resume receipt"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
      - name: Upload resume receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: two-segment-resume-receipt-${{ github.run_id }}
          path: catalog/RESUME_SMOKE_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
