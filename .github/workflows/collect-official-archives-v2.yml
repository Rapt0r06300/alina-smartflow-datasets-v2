name: collect-official-archives-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-official-archives-v2.yml'
  schedule:
    - cron: '11 6 * * *'
  workflow_dispatch:
    inputs:
      archive_date:
        description: "UTC archive day (YYYY-MM-DD); defaults to three days ago"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: dataset-v2-official-archive-collection
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      collector_sha: ${{ steps.code.outputs.sha }}
      archive_date: ${{ steps.params.outputs.archive_date }}
    steps:
      - name: Checkout Alina collector source
        uses: actions/checkout@v4
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: main
          path: alina
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: code
        name: Pin collector SHA
        run: echo "sha=$(git -C alina rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: params
        name: Resolve bounded archive day
        env:
          REQUESTED_DATE: ${{ inputs.archive_date || '' }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timedelta, timezone

          requested = os.environ.get("REQUESTED_DATE", "").strip()
          if requested:
              datetime.strptime(requested, "%Y-%m-%d")
              value = requested
          else:
              value = (
                  datetime.now(timezone.utc).date() - timedelta(days=3)
              ).isoformat()
          print("archive_date=" + value)
          PY

  collect:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - venue: binance
            coin: BTC
            symbol: BTCUSDT
          - venue: binance
            coin: ETH
            symbol: ETHUSDT
          - venue: binance
            coin: SOL
            symbol: SOLUSDT
          - venue: bybit
            coin: BTC
            symbol: BTCUSDT
          - venue: bybit
            coin: ETH
            symbol: ETHUSDT
          - venue: bybit
            coin: SOL
            symbol: SOLUSDT
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      COLLECTOR_SHA: ${{ needs.prepare.outputs.collector_sha }}
      ARCHIVE_DATE: ${{ needs.prepare.outputs.archive_date }}
      COLLECTION_RUN_ID: archive-${{ github.run_id }}
      HL_ENABLE_MAINNET_EXECUTION: "0"
      HL_ENABLE_TESTNET_EXECUTION: "0"
      REAL_MAINNET_TRADING: "false"
      TESTNET_EXECUTION_ENABLED: "false"
      HYPERSMART_ENABLE_REAL_ORDERS: "0"
      ENABLE_REAL_ORDERS: "0"

    steps:
      - name: Checkout pinned Alina collector source
        uses: actions/checkout@v4
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: ${{ needs.prepare.outputs.collector_sha }}
          path: alina
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install collector
        run: python -m pip install --disable-pip-version-check -e ./alina

      - name: Import one bounded official archive day
        run: |
          set -euo pipefail
          python alina/tools/collect_official_archive_backfill.py \
            --venue "${{ matrix.venue }}" \
            --coin "${{ matrix.coin }}" \
            --symbol "${{ matrix.symbol }}" \
            --start-date "$ARCHIVE_DATE" \
            --output "$RUNNER_TEMP/archive-v2" \
            --collector-version "$COLLECTOR_SHA" \
            --collection-run-id "$COLLECTION_RUN_ID" \
            --max-days 1 \
            --rotate-mb 256

      - name: Publish immutable archive V2 release
        run: |
          set -euo pipefail
          TAG="archive-v2-${GITHUB_RUN_ID}-${{ matrix.venue }}-${{ matrix.coin }}"
          python alina/tools/publish_dataset_v2_release.py \
            "$RUNNER_TEMP/archive-v2/bundle" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --target main \
            --title "Alina official archive ${{ matrix.venue }} ${{ matrix.coin }} $ARCHIVE_DATE"

      - name: Final archive summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/archive-v2/archive_summary.json" ]; then
            cat "$RUNNER_TEMP/archive-v2/archive_summary.json"
          fi

  index:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout dataset control plane
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download completed archive run manifests
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/archive-run-manifests"
          mkdir -p "$ROOT"
          for venue in binance bybit; do
            for coin in BTC ETH SOL; do
              tag="archive-v2-${GITHUB_RUN_ID}-${venue}-${coin}"
              dir="$ROOT/${venue}-${coin}"
              mkdir -p "$dir"
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name' 2>/dev/null \
                | grep -Fxq 'RUN_MANIFEST.json'; then
                gh release download "$tag" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern 'RUN_MANIFEST.json' \
                  --dir "$dir"
              else
                echo "skip incomplete archive release: $tag"
              fi
            done
          done

      - name: Index verified archive manifests
        run: |
          set -euo pipefail
          mapfile -t MANIFESTS < <(
            find "$RUNNER_TEMP/archive-run-manifests" -name RUN_MANIFEST.json -type f | sort
          )
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "NO_VERIFIED_ARCHIVE_MANIFESTS"
            exit 2
          fi
          python tools/index_run_manifest.py "${MANIFESTS[@]}"

      - name: Validate control plane
        run: |
          set -euo pipefail
          python tools/check_dataset_quality.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests

      - name: Commit indexed archive manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog datasets
          if git diff --cached --quiet; then
            echo "No archive index changes."
            exit 0
          fi
          git commit -m "data: index official archive run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
