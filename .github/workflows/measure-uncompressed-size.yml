name: measure-uncompressed-size
on:
  workflow_dispatch:
    inputs:
      limit:
        required: false
        default: "200"
  schedule:
    - cron: "53 */3 * * *"
permissions:
  contents: write
concurrency:
  group: dataset-v2-uncompressed-size
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Measure exact decompressed bytes
        env:
          GH_TOKEN: "${{ github.token }}"
        run: python tools/measure_uncompressed_sizes.py --limit "${{ inputs.limit || '200' }}"
      - name: Publish size receipt
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/UNCOMPRESSED_SIZE_PATCH.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish exact uncompressed size progress"
          git push origin HEAD:main
