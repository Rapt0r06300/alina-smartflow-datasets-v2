name: collection-successor-relay
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
  actions: write
concurrency:
  group: collection-successor-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Build current-epoch handoff plan
        run: python tools/collection_relay.py > "$RUNNER_TEMP/relay-plan.json"
      - name: Dispatch explicit successors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' "$RUNNER_TEMP/relay-plan.json"
          import json, os, subprocess, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          if plan.get("phase") != "COLLECT":
              raise SystemExit(0)
          for row in plan.get("dispatches", []):
              campaign_id = str(row["campaign_id"])
              subprocess.run([
                  "gh", "workflow", "run", "resumable-campaign-worker.yml",
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--ref", "main",
                  "-f", f"campaign_id={campaign_id}",
              ], check=True)
          print(json.dumps({
              "phase_epoch": plan.get("phase_epoch"),
              "dispatch_count": len(plan.get("dispatches", [])),
          }, sort_keys=True))
          PY
      - name: Upload handoff plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collection-relay-plan-${{ github.run_id }}
          path: "$RUNNER_TEMP/relay-plan.json"
          if-no-files-found: error
          retention-days: 7
