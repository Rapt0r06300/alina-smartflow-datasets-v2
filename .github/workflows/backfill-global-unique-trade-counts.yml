name: backfill-global-unique-trade-counts
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum immutable trade assets to scan"
        required: false
        default: "200"
  schedule:
    - cron: "43 */2 * * *"
permissions:
  contents: write
concurrency:
  group: dataset-v2-global-unique-counts
  cancel-in-progress: false
jobs:
  deduplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Scan immutable assets with global identity store
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          python tools/backfill_global_unique_trade_counts.py --limit "${{ inputs.limit || '200' }}"
      - name: Publish deduplication patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/TRADE_UNIQUE_COUNT_PATCH.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish global unique trade count progress"
          git push origin HEAD:main
