name: collect-event-intelligence-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-event-intelligence-v2.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset-v2-event-intelligence-collection
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.code.outputs.source_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      HL_ENABLE_MAINNET_EXECUTION: "0"
      HL_ENABLE_TESTNET_EXECUTION: "0"
      REAL_MAINNET_TRADING: "false"
      TESTNET_EXECUTION_ENABLED: "false"
      HYPERSMART_ENABLE_REAL_ORDERS: "0"
      ENABLE_REAL_ORDERS: "0"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Alina source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: main
          path: alina
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install pinned collector
        run: python -m pip install --disable-pip-version-check -e ./alina

      - id: code
        name: Pin collector SHA
        run: echo "source_sha=$(git -C alina rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Collect public read-only event sources
        env:
          PYTHONPATH: alina/src:alina
          COLLECTION_RUN_ID: event-${{ github.run_id }}
        run: |
          set -euo pipefail
          python alina/tools/collect_event_intelligence_v2.py \
            --output "$RUNNER_TEMP/event-intelligence-v2" \
            --collector-version "${{ steps.code.outputs.source_sha }}" \
            --collection-run-id "$COLLECTION_RUN_ID"

      - id: release
        name: Publish immutable Event Intelligence V2 release
        env:
          PYTHONPATH: alina/src:alina
        run: |
          set -euo pipefail
          TAG="event-intelligence-v2-${GITHUB_RUN_ID}"
          python alina/tools/publish_dataset_v2_release.py \
            "$RUNNER_TEMP/event-intelligence-v2" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --target main \
            --title "Alina Event Intelligence V2 run ${GITHUB_RUN_ID}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  index:
    needs: collect
    if: always() && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dataset-v2-control-plane-index
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout dataset control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Download bounded release manifest
        run: |
          set -euo pipefail
          python tools/download_release_manifests.py \
            --repository "$GITHUB_REPOSITORY" \
            --destination "$RUNNER_TEMP/event-run-manifest" \
            --attempts 12 \
            --poll-seconds 10 \
            "${{ needs.collect.outputs.release_tag }}"

      - name: Index Event Intelligence manifest
        run: |
          set -euo pipefail
          mapfile -t MANIFESTS < <(
            find "$RUNNER_TEMP/event-run-manifest" -name RUN_MANIFEST.json -type f | sort
          )
          test "${#MANIFESTS[@]}" -gt 0
          python tools/index_run_manifest.py "${MANIFESTS[@]}"

      - name: Validate control plane
        run: |
          set -euo pipefail
          python tools/check_dataset_quality.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests

      - name: Commit indexed Event Intelligence manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog datasets
          if git diff --cached --quiet; then
            echo "No Event Intelligence catalog change."
            exit 0
          fi
          git commit -m "data: index Event Intelligence run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
