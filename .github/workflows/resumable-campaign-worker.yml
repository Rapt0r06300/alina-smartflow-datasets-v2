name: resumable-campaign-worker
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: resumable-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      REAL_MAINNET_TRADING: "false"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - name: Checkout Dataset V2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - id: pin
        name: Read pinned code SHA
        shell: bash
        run: |
          set -euo pipefail
          M="catalog/campaigns/${{ inputs.campaign_id }}.json"
          test -f "$M"
          echo "sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["code_sha"])' "$M")" >> "$GITHUB_OUTPUT"

      - name: Checkout exact campaign code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: ${{ steps.pin.outputs.sha }}
          path: alina
          persist-credentials: false

      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check -e ./alina

      - name: Acquire durable campaign lease
        env:
          CAMPAIGN_ID: "${{ inputs.campaign_id }}"
        shell: bash
        run: |
          set -euo pipefail
          M="catalog/campaigns/$CAMPAIGN_ID.json"
          OUT="$(PYTHONPATH=alina/src python alina/tools/resumable_campaign.py start "$M" --owner "$GITHUB_RUN_ID" --ttl-s 20700)"
          printf '%s\n' "$OUT"
          TOKEN="$(printf '%s\n' "$OUT" | sed -n 's/^lease_token=//p' | tail -n1)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "LEASE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$M"
          git commit -m "campaign: lease $CAMPAIGN_ID run $GITHUB_RUN_ID"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1

      - name: Build frozen work unit
        env:
          CAMPAIGN_ID: "${{ inputs.campaign_id }}"
        shell: bash
        run: |
          set -euo pipefail
          M="catalog/campaigns/$CAMPAIGN_ID.json"
          PYTHONPATH=alina/src python alina/tools/resumable_campaign.py validate "$M"
          python - <<'PY' "$M" > "$RUNNER_TEMP/unit.env"
          import json,os,shlex,sys
          m=json.load(open(sys.argv[1],encoding="utf-8"))
          idx=int(m.get("chunk_index",0))
          kind=m["kind"]
          part=dict(m.get("cursor") or {})
          part.update({"chunk_index":idx,"code_sha":m.get("code_sha")})
          if kind=="market_collection":
              part.setdefault("duration_s",3600)
              part.setdefault("coins","BTC,ETH,SOL")
              part.setdefault("rotate_mb",64)
          elif kind=="copy_vault_collection":
              part.setdefault("duration_s",3600)
              part.setdefault("max_vaults",20)
              part.setdefault("vault_shard_count",1)
              part.setdefault("vault_shard_index",0)
              part.setdefault("rotate_mb",64)
          elif kind=="official_archive_collection":
              required=("venue","coin","symbol","start_date")
              missing=[key for key in required if not part.get(key)]
              if missing:
                  raise SystemExit("archive cursor missing: "+",".join(missing))
              part.setdefault("end_date",part["start_date"])
              part.setdefault("max_days",1)
          elif kind in {"replay","backtest","module_pnl_proof"}:
              part["workspace_root"]=os.path.join(
                  os.environ["RUNNER_TEMP"],
                  "alina-replay-workspace",
                  m["campaign_id"],
                  str(idx),
              )
          print("KIND="+shlex.quote(kind))
          print("UNIT="+shlex.quote(str(idx)))
          print("PART="+shlex.quote(json.dumps(part,separators=(",",":"))))
          PY
          cat "$RUNNER_TEMP/unit.env" >> "$GITHUB_ENV"

      - name: Run one bounded pinned unit
        env:
          CAMPAIGN_ID: "${{ inputs.campaign_id }}"
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=alina/src python alina/tools/run_resumable_campaign.py             --campaign-id "$CAMPAIGN_ID"             --kind "$KIND"             --unit-id "$UNIT"             --partition-json "$PART"             --soft-deadline-s 18900             > "$RUNNER_TEMP/result.json"
          python -m json.tool "$RUNNER_TEMP/result.json" >/dev/null

      - name: Publish collection bundle and index immediately
        if: env.KIND == 'market_collection' || env.KIND == 'copy_vault_collection' || env.KIND == 'official_archive_collection' || env.KIND == 'event_intelligence_collection'
        env:
          CAMPAIGN_ID: "${{ inputs.campaign_id }}"
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/result.json"))["status"])')"
          [ "$STATUS" = "COMPLETE" ] || exit 0
          BUNDLE="$(python -c 'import json,os; print((json.load(open(os.environ["RUNNER_TEMP"]+"/result.json")).get("payload") or {}).get("bundle_root") or "")')"
          test -n "$BUNDLE"
          test -f "$BUNDLE/BUNDLE_INDEX.json"

          case "$KIND" in
            market_collection) PREFIX="data-v2-campaign" ;;
            copy_vault_collection) PREFIX="copy-vault-v2-campaign" ;;
            official_archive_collection) PREFIX="archive-v2-campaign" ;;
            event_intelligence_collection) PREFIX="event-intelligence-v2-campaign" ;;
            *) exit 2 ;;
          esac
          SAFE_ID="$(printf '%s' "$CAMPAIGN_ID-$UNIT" | tr -cs 'A-Za-z0-9._-' '-')"
          TAG="$PREFIX-$SAFE_ID"

          PYTHONPATH=alina/src python alina/tools/publish_dataset_v2_release.py             "$BUNDLE"             --repository "$GITHUB_REPOSITORY"             --tag "$TAG"             --target main             --title "Alina Dataset V2 $CAMPAIGN_ID unit $UNIT"             > "$RUNNER_TEMP/publish.json"

          DEST="$RUNNER_TEMP/published/$TAG"
          mkdir -p "$DEST"
          gh release download "$TAG"             --repo "$GITHUB_REPOSITORY"             --pattern RUN_MANIFEST.json             --dir "$DEST"             --clobber
          python tools/index_run_manifest.py "$DEST/RUN_MANIFEST.json"
          python tools/build_catalog_metrics.py
          python tools/check_dataset_quality.py

          python - <<'PY' "$RUNNER_TEMP/result.json" "$TAG" "$DEST/RUN_MANIFEST.json"
          import hashlib,json,sys
          path,tag,manifest_path=sys.argv[1:]
          row=json.load(open(path,encoding="utf-8"))
          payload=dict(row.get("payload") or {})
          run=json.load(open(manifest_path,encoding="utf-8"))
          payload["dataset_release_tag"]=tag
          payload["dataset_indexed"]=True
          payload["published_shards"]=int(run.get("shard_count") or 0)
          payload["published_safe_shards"]=int(run.get("safe_count") or 0)
          payload["published_partial_shards"]=int(run.get("partial_count") or 0)
          payload["published_reject_shards"]=int(run.get("reject_count") or 0)
          row["payload"]=payload
          raw=json.dumps(payload,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          row["sha256"]=hashlib.sha256(raw).hexdigest()
          open(path,"w",encoding="utf-8").write(json.dumps(row,sort_keys=True)+"\n")
          PY

      - name: Publish replay/backtest/PnL evidence
        if: env.KIND == 'replay' || env.KIND == 'backtest' || env.KIND == 'module_pnl_proof'
        env:
          CAMPAIGN_ID: "${{ inputs.campaign_id }}"
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/result.json"))["status"])')"
          [ "$STATUS" = "COMPLETE" ] || exit 0
          WORKSPACE="$(python -c 'import json,os; p=(json.load(open(os.environ["RUNNER_TEMP"]+"/result.json")).get("payload") or {}); print(p.get("safe_workspace") or p.get("output_root") or "")')"
          test -n "$WORKSPACE"
          EVIDENCE="$RUNNER_TEMP/evidence"
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"

          for rel in runtime/reports runtime/scoreboards runtime/economic_campaigns; do
            if [ -d "$WORKSPACE/$rel" ]; then
              mkdir -p "$EVIDENCE/$(dirname "$rel")"
              cp -a "$WORKSPACE/$rel" "$EVIDENCE/$(dirname "$rel")/"
            fi
          done
          cp "$RUNNER_TEMP/result.json" "$EVIDENCE/adapter-result.json"

          SAFE_ID="$(printf '%s' "$CAMPAIGN_ID-$UNIT" | tr -cs 'A-Za-z0-9._-' '-')"
          TAG="campaign-evidence-$SAFE_ID"
          python - <<'PY' "$RUNNER_TEMP/result.json" "$TAG"
          import hashlib,json,sys
          path,tag=sys.argv[1:]
          row=json.load(open(path,encoding="utf-8"))
          payload=dict(row.get("payload") or {})
          payload["evidence_release_tag"]=tag
          payload["evidence_persisted"]=True
          row["payload"]=payload
          raw=json.dumps(payload,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          row["sha256"]=hashlib.sha256(raw).hexdigest()
          open(path,"w",encoding="utf-8").write(json.dumps(row,sort_keys=True)+"\n")
          PY
          cp "$RUNNER_TEMP/result.json" "$EVIDENCE/adapter-result.json"
          tar -C "$EVIDENCE" -czf "$RUNNER_TEMP/campaign-evidence.tar.gz" .

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target main               --title "Alina campaign evidence $CAMPAIGN_ID unit $UNIT"               --notes "Paper/read-only campaign evidence. No real execution."
          fi
          gh release upload "$TAG"             "$RUNNER_TEMP/campaign-evidence.tar.gz"             "$RUNNER_TEMP/result.json"             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Finalize campaign checkpoint
        env:
          CAMPAIGN_ID: "${{ inputs.campaign_id }}"
        shell: bash
        run: |
          set -euo pipefail
          M="catalog/campaigns/$CAMPAIGN_ID.json"
          PYTHONPATH=alina/src python - <<'PY' "$M" "$RUNNER_TEMP/result.json" "$LEASE_TOKEN"
          import json,sys
          from hl_observer.control_plane.resumable_campaign import (
              CampaignManifest,
              complete_work_unit,
              mark_continuation,
              mark_terminal,
              verify_lease,
          )
          path,result_path,token=sys.argv[1:]
          m=CampaignManifest.from_dict(json.load(open(path,encoding="utf-8")))
          if not verify_lease(m,token):
              raise SystemExit("stale lease: refusing checkpoint publication")
          r=json.load(open(result_path,encoding="utf-8"))
          uid=str(m.chunk_index)
          complete_work_unit(m,uid,r["sha256"],r.get("payload") or {})
          if r["status"]=="COMPLETE":
              mark_terminal(m,"COMPLETE","unit_complete")
          elif r["status"]=="CONTINUATION_REQUIRED":
              mark_continuation(
                  m,
                  (r.get("payload") or {}).get("reason","continuation_required"),
                  progressed=bool(r.get("progressed",False)),
              )
          else:
              payload=r.get("payload") or {}
              category=str(payload.get("failure_category") or "QUALITY")
              if category in {"INFRASTRUCTURE","TEMPORARY_EXTERNAL"}:
                  mark_continuation(
                      m,
                      payload.get("reason","adapter_failed"),
                      progressed=False,
                      failure=True,
                  )
              else:
                  mark_terminal(m,"FAILED",payload.get("reason","adapter_failed"))
          open(path,"w",encoding="utf-8").write(
              json.dumps(m.to_dict(),sort_keys=True,indent=2)+"\n"
          )
          PY

      - name: Publish checkpoint, index and metrics
        env:
          CAMPAIGN_ID: "${{ inputs.campaign_id }}"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog datasets
          git diff --cached --quiet && exit 0
          git commit -m "campaign: checkpoint $CAMPAIGN_ID unit $UNIT"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i*2))
          done
          exit 1
