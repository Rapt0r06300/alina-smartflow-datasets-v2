name: resumable-campaign-worker
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        required: true
        type: string
  workflow_call:
    inputs:
      campaign_id:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: resumable-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      CAMPAIGN_ID: "${{ inputs.campaign_id }}"
      GH_TOKEN: "${{ github.token }}"
      REAL_MAINNET_TRADING: "false"
      ENABLE_REAL_ORDERS: "0"
    steps:
      - name: Checkout Dataset V2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - id: pin
        name: Read pinned code SHA
        shell: bash
        run: |
          set -euo pipefail
          M="catalog/campaigns/$CAMPAIGN_ID.json"
          test -f "$M"
          python - <<'PY' "$M" >> "$GITHUB_OUTPUT"
          import json,sys
          m=json.load(open(sys.argv[1]))
          print("sha="+str(m["code_sha"]))
          print("kind="+str(m["kind"]))
          print("status="+str(m["status"]))
          PY

      - name: Checkout pinned Alina code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: ${{ steps.pin.outputs.sha }}
          path: alina
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: alina/pyproject.toml

      - name: Install pinned Alina runtime
        run: python -m pip install --disable-pip-version-check -e ./alina

      - id: claim
        name: Claim durable campaign lease
        shell: bash
        run: |
          set -euo pipefail
          M="catalog/campaigns/$CAMPAIGN_ID.json"
          git pull --rebase origin main
          STATUS="$(python - <<'PY' "$M"
          import json,sys
          print(json.load(open(sys.argv[1]))["status"])
          PY
          )"
          case "$STATUS" in
            COMPLETE|FAILED|UNAVAILABLE|PARTIAL|REJECT)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Campaign already terminal: $STATUS"
              exit 0
              ;;
          esac
          DIGEST="$(PYTHONPATH=alina/src python alina/tools/resumable_campaign.py validate "$M")"
          CLAIM="$(PYTHONPATH=alina/src python alina/tools/resumable_campaign.py start "$M"             --owner "$GITHUB_RUN_ID" --ttl-s 20700 --expected-digest "$DIGEST")"
          TOKEN="$(printf '%s\n' "$CLAIM" | sed -n 's/^lease_token=//p' | tail -1)"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "lease_token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$M"
          git commit -m "campaign: claim $CAMPAIGN_ID run $GITHUB_RUN_ID"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i*2))
          done
          exit 1

      - id: unit
        name: Run one bounded real unit
        if: steps.claim.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          M="catalog/campaigns/$CAMPAIGN_ID.json"
          python - <<'PY' "$M" > "$RUNNER_TEMP/unit.env"
          import json,os,shlex,sys
          m=json.load(open(sys.argv[1]))
          idx=int(m.get("chunk_index",0))
          kind=str(m["kind"])
          part=dict(m.get("cursor") or {})
          part.update({
              "chunk_index":idx,
              "code_sha":m.get("code_sha"),
              "output_root":os.path.join(os.environ["RUNNER_TEMP"],"campaign-output"),
          })
          if kind=="market_collection":
              part.setdefault("duration_s",3500)
              part.setdefault("coins","BTC,ETH,SOL")
              part.setdefault("rotate_mb",64)
          elif kind=="copy_vault_collection":
              part.setdefault("duration_s",3500)
              part.setdefault("max_vaults",20)
              part.setdefault("vault_shard_count",1)
              part.setdefault("vault_shard_index",0)
              part.setdefault("rotate_mb",64)
          elif kind=="official_archive_collection":
              part.setdefault("max_days",1)
          elif kind in {"replay","backtest","module_pnl_proof"}:
              part["workspace_root"]=os.path.join(
                  os.environ["RUNNER_TEMP"],
                  "alina-replay-workspace",
              )
              part.setdefault("max_shards",64 if kind=="replay" else 128)
          print("KIND="+shlex.quote(kind))
          print("UNIT="+shlex.quote(str(idx)))
          print("PART="+shlex.quote(json.dumps(part,separators=(",",":"))))
          PY
          source "$RUNNER_TEMP/unit.env"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "unit=$UNIT" >> "$GITHUB_OUTPUT"
          PYTHONPATH=alina/src python alina/tools/run_resumable_campaign.py             --campaign-id "$CAMPAIGN_ID"             --kind "$KIND"             --unit-id "$UNIT"             --partition-json "$PART"             --soft-deadline-s 18900             > "$RUNNER_TEMP/result.json"
          test -s "$RUNNER_TEMP/result.json"
          cat "$RUNNER_TEMP/result.json"

      - id: durable
        name: Persist collection data or analysis evidence
        if: steps.claim.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          KIND="${{ steps.unit.outputs.kind }}"
          UNIT="${{ steps.unit.outputs.unit }}"
          STATUS="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"result.json")))["status"])')"
          if [ "$STATUS" != "COMPLETE" ]; then
            echo "No durable output publish required for status=$STATUS"
            exit 0
          fi

          if [[ "$KIND" == "market_collection" || "$KIND" == "copy_vault_collection" || "$KIND" == "official_archive_collection" || "$KIND" == "event_intelligence_collection" ]]; then
            BUNDLE="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"result.json")))["payload"]["bundle_root"])')"
            test -n "$BUNDLE"
            test -f "$BUNDLE/BUNDLE_INDEX.json"
            TAG="data-v2-campaign-$CAMPAIGN_ID-u$UNIT"
            python alina/tools/publish_dataset_v2_release.py               "$BUNDLE"               --repository "$GITHUB_REPOSITORY"               --tag "$TAG"               --target main               --title "Alina Dataset V2 $CAMPAIGN_ID unit $UNIT"
            test -f "$BUNDLE/RUN_MANIFEST.json"
            python - <<'PY' "$RUNNER_TEMP/result.json" "$BUNDLE/RUN_MANIFEST.json" "$TAG"
            import hashlib,json,sys
            rp,mp,tag=sys.argv[1:]
            r=json.load(open(rp))
            m=json.load(open(mp))
            p=r["payload"]
            p["release_tag"]=tag
            p["release_repository"]="Rapt0r06300/alina-smartflow-datasets-v2"
            p["shard_count"]=int(m.get("shard_count") or 0)
            p["safe_count"]=int(m.get("safe_count") or 0)
            p["partial_count"]=int(m.get("partial_count") or 0)
            p["reject_count"]=int(m.get("reject_count") or 0)
            raw=json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
            r["sha256"]=hashlib.sha256(raw).hexdigest()
            open(rp,"w").write(json.dumps(r,sort_keys=True)+"\n")
            PY
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            WORKSPACE="$RUNNER_TEMP/alina-replay-workspace"
            EVIDENCE="$RUNNER_TEMP/$CAMPAIGN_ID-u$UNIT-evidence.tgz"
            mkdir -p "$RUNNER_TEMP/evidence"
            cp "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/evidence/result.json"
            if [ -d "$WORKSPACE/runtime/reports" ]; then
              cp -R "$WORKSPACE/runtime/reports" "$RUNNER_TEMP/evidence/reports"
            fi
            tar -C "$RUNNER_TEMP/evidence" -czf "$EVIDENCE" .
            TAG="campaign-evidence-$CAMPAIGN_ID-u$UNIT"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" "$EVIDENCE" --clobber --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" "$EVIDENCE"                 --repo "$GITHUB_REPOSITORY"                 --target main                 --title "Alina campaign evidence $CAMPAIGN_ID unit $UNIT"                 --notes "Paper/read-only evidence. No real execution."
            fi
            python - <<'PY' "$RUNNER_TEMP/result.json" "$TAG"
            import hashlib,json,sys
            rp,tag=sys.argv[1:]
            r=json.load(open(rp))
            p=r["payload"]
            p["evidence_release_tag"]=tag
            p["evidence_repository"]="Rapt0r06300/alina-smartflow-datasets-v2"
            raw=json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
            r["sha256"]=hashlib.sha256(raw).hexdigest()
            open(rp,"w").write(json.dumps(r,sort_keys=True)+"\n")
            PY
            echo "evidence_tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish final campaign checkpoint
        if: steps.claim.outputs.skip != 'true' && always()
        env:
          LEASE_TOKEN: "${{ steps.claim.outputs.lease_token }}"
        shell: bash
        run: |
          set -euo pipefail
          M="catalog/campaigns/$CAMPAIGN_ID.json"
          test -s "$RUNNER_TEMP/result.json"
          PYTHONPATH=alina/src python - <<'PY' "$M" "$RUNNER_TEMP/result.json"
          import json,os,sys
          from hl_observer.control_plane.resumable_campaign import (
              CampaignManifest,
              complete_work_unit,
              mark_continuation,
              mark_terminal,
              verify_lease,
          )
          p,rp=sys.argv[1:]
          m=CampaignManifest.from_dict(json.load(open(p)))
          token=os.environ["LEASE_TOKEN"]
          if not verify_lease(m,token):
              raise SystemExit("stale lease: refusing checkpoint")
          r=json.load(open(rp))
          uid=str(m.chunk_index)
          complete_work_unit(m,uid,r["sha256"],r["payload"])
          if r["status"]=="COMPLETE":
              mark_terminal(m,"COMPLETE","unit_complete")
          elif r["status"]=="CONTINUATION_REQUIRED":
              mark_continuation(
                  m,
                  r.get("payload",{}).get("reason","continuation_required"),
                  progressed=bool(r.get("progressed",False)),
              )
          else:
              payload=r.get("payload") or {}
              category=str(payload.get("failure_category") or "QUALITY")
              if category in {"INFRASTRUCTURE","TEMPORARY_EXTERNAL"}:
                  mark_continuation(
                      m,
                      payload.get("reason","adapter_failed"),
                      progressed=False,
                      failure=True,
                  )
              else:
                  mark_terminal(m,"FAILED",payload.get("reason","adapter_failed"))
          open(p,"w").write(json.dumps(m.to_dict(),sort_keys=True,indent=2)+"\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$M"
          git commit -m "campaign: checkpoint $CAMPAIGN_ID"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i*2))
          done
          exit 1
