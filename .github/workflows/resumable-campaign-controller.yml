name: resumable-campaign-controller
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resumable-campaign-controller.yml'
      - 'control/alina-phase.json'
      - 'catalog/campaigns/analysis-*.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  # v3 intentionally moves off the legacy v2 serialization group so a long
  # pre-fix Copy-Vault fan-out cannot starve fresh market/L2 work.
  group: resumable-campaign-controller-v4
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      copy_matrix: ${{ steps.due.outputs.copy_matrix }}
      copy_count: ${{ steps.due.outputs.copy_count }}
      other_matrix: ${{ steps.due.outputs.other_matrix }}
      other_count: ${{ steps.due.outputs.other_count }}
      phase: ${{ steps.due.outputs.phase }}
      phase_epoch: ${{ steps.due.outputs.phase_epoch }}
    steps:
      - name: Checkout Dataset V2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Refresh Dataset V2 main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Checkout current campaign CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: main
          path: alina
          persist-credentials: false

      - id: due
        name: Build bounded due-work matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/campaigns
          PHASE_META="$(python tools/phase_gate.py read)"
          PHASE="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["phase"])' "$PHASE_META")"
          PHASE_EPOCH="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["epoch"])' "$PHASE_META")"
          ANALYSIS_STAGE="$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("analysis_stage") or "")' "$PHASE_META")"
          echo "phase=$PHASE epoch=$PHASE_EPOCH analysis_stage=$ANALYSIS_STAGE"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "phase_epoch=$PHASE_EPOCH" >> "$GITHUB_OUTPUT"
          PYTHONPATH=alina/src python alina/tools/resumable_campaign.py             list-due catalog/campaigns             --current-phase "$PHASE"             --current-epoch "$PHASE_EPOCH"             --current-analysis-stage "$ANALYSIS_STAGE"             > "$RUNNER_TEMP/all-due.txt"
          head -n 128 "$RUNNER_TEMP/all-due.txt" > "$RUNNER_TEMP/due.txt"
          python - <<'PY' "$RUNNER_TEMP/due.txt" "$PHASE_EPOCH" >> "$GITHUB_OUTPUT"
          import json,sys
          from pathlib import Path
          phase_epoch=int(sys.argv[2])
          ids=[line.strip() for line in open(sys.argv[1],encoding="utf-8") if line.strip()]
          copy_ids=[]
          other_ids=[]
          for campaign_id in ids:
              path=Path("catalog/campaigns")/(campaign_id+".json")
              try:
                  row=json.load(open(path,encoding="utf-8"))
                  kind=str(row.get("kind") or "")
                  cursor=row.get("cursor") if isinstance(row.get("cursor"),dict) else {}
              except (OSError,ValueError,TypeError):
                  kind=""
                  cursor={}
              # Dedicated replay resume-proof campaigns are owned only by the
              # two-segment fresh-runner workflow.  Excluding them here prevents
              # the normal controller from racing the proof segments.
              if cursor.get("resume_proof") is True:
                  continue
              (copy_ids if kind=="copy_vault_collection" else other_ids).append(campaign_id)
          # Keep exactly one user-specific Copy-Vault lane active globally
          # for the current epoch. GitHub-hosted jobs may share an egress IP,
          # so separate runners must not be assumed to multiply Hyperliquid's
          # per-IP unique-user subscription allowance.
          active_copy=False
          active_other=0
          collection_other_kinds={
              "market_collection",
              "event_intelligence_collection",
              "official_archive_collection",
          }
          for path in Path("catalog/campaigns").glob("*.json"):
              try:
                  row=json.load(open(path,encoding="utf-8"))
              except (OSError,ValueError,TypeError):
                  continue
              if (
                  row.get("creation_phase")!="COLLECT"
                  or int(row.get("phase_epoch") or 0)!=phase_epoch
                  or row.get("status")!="RUNNING"
              ):
                  continue
              kind=str(row.get("kind") or "")
              if kind=="copy_vault_collection":
                  active_copy=True
              elif kind in collection_other_kinds:
                  active_other+=1
          copy_ids=copy_ids[:1]
          if active_copy:
              copy_ids=[]
          other_capacity=max(0,12-active_other)
          other_ids=other_ids[:other_capacity]
          print("copy_count="+str(len(copy_ids)))
          print("copy_matrix="+json.dumps({"campaign_id":copy_ids},separators=(",",":")))
          print("other_count="+str(len(other_ids)))
          print("other_matrix="+json.dumps({"campaign_id":other_ids},separators=(",",":")))
          PY


  dispatch_collect:
    needs: select
    if: ${{ needs.select.outputs.phase == 'COLLECT' && (needs.select.outputs.copy_count != '0' || needs.select.outputs.other_count != '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      COPY_MATRIX: ${{ needs.select.outputs.copy_matrix }}
      OTHER_MATRIX: ${{ needs.select.outputs.other_matrix }}
      PHASE_EPOCH: ${{ needs.select.outputs.phase_epoch }}
    steps:
      - name: Dispatch due COLLECT workers without blocking controller
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' "$COPY_MATRIX" "$OTHER_MATRIX" > "$RUNNER_TEMP/due-workers.txt"
          import json,sys
          seen=set()
          for raw in sys.argv[1:]:
              payload=json.loads(raw)
              for campaign_id in payload.get("campaign_id", []):
                  campaign_id=str(campaign_id).strip()
                  if campaign_id and campaign_id not in seen:
                      seen.add(campaign_id)
                      print(campaign_id)
          PY
          REQUESTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          while IFS= read -r CAMPAIGN_ID; do
            [ -n "$CAMPAIGN_ID" ] || continue
            echo "dispatching $CAMPAIGN_ID for COLLECT epoch $PHASE_EPOCH"
            gh workflow run resumable-campaign-worker.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f campaign_id="$CAMPAIGN_ID" \
              -f phase_epoch="$PHASE_EPOCH" \
              -f predecessor_run_id="$GITHUB_RUN_ID" \
              -f requested_handoff_at_utc="$REQUESTED_AT"
          done < "$RUNNER_TEMP/due-workers.txt"

  copy_work:
    needs: select
    if: ${{ needs.select.outputs.phase != 'COLLECT' && needs.select.outputs.copy_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.copy_matrix) }}
    uses: ./.github/workflows/resumable-campaign-worker.yml
    with:
      campaign_id: ${{ matrix.campaign_id }}
    permissions:
      actions: write
      contents: write

  other_work:
    needs: select
    if: ${{ needs.select.outputs.phase != 'COLLECT' && needs.select.outputs.other_count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.other_matrix) }}
    uses: ./.github/workflows/resumable-campaign-worker.yml
    with:
      campaign_id: ${{ matrix.campaign_id }}
    permissions:
      actions: write
      contents: write

  advance_analysis:
    needs: [select, copy_work, other_work]
    if: ${{ always() && needs.select.outputs.phase == 'ANALYZE' && needs.select.result == 'success' && (needs.copy_work.result == 'success' || needs.copy_work.result == 'skipped') && (needs.other_work.result == 'success' || needs.other_work.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Refresh global closure after bounded work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_TOKEN-authored checkpoint pushes do not recursively trigger
          # push workflows. Rebuild the cross-repository closure explicitly.
          # That workflow dispatches analysis-stage-controller only after the
          # fresh closure receipt has been durably published, avoiding a race
          # where SCOREBOARD -> DONE reads stale implementation flags.
          gh workflow run global-implementation-closure.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

