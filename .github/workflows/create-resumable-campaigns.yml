name: create-resumable-campaigns
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resumable-campaign-creation
  cancel-in-progress: false
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Checkout current campaign code and pin exact SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: main
          path: alina
          persist-credentials: false
      - name: Create deterministic frozen campaigns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/campaigns
          BUCKET="$(date -u +%Y%m%d%H)"
          DAY="$(date -u +%Y-%m-%d)"
          PREV_DAY="$(date -u -d 'yesterday' +%Y-%m-%d)"
          CODE_SHA="$(git -C alina rev-parse HEAD)"
          PLAN_SHA="$(printf '%s' 'resumable-github-campaigns-v1' | sha256sum | cut -d' ' -f1)"
          make_campaign() {
            KIND="$1"; ID="$2"; CFG_TEXT="$3"; CURSOR="$4"
            P="catalog/campaigns/$ID.json"
            CFG_SHA="$(printf '%s' "$CFG_TEXT|$CURSOR" | sha256sum | cut -d' ' -f1)"
            if [ ! -f "$P" ]; then
              PYTHONPATH=alina/src python alina/tools/resumable_campaign.py create "$P"                 --campaign-id "$ID" --kind "$KIND" --code-sha "$CODE_SHA"                 --dataset-generation V2_FRESH --config-sha256 "$CFG_SHA"                 --work-plan-sha256 "$PLAN_SHA" --cursor-json "$CURSOR"
            fi
          }
          make_campaign market_collection "market-$BUCKET" "market-hourly-v2"             '{"coins":"BTC,ETH,SOL","duration_s":600,"rotate_mb":64}'
          make_campaign copy_vault_collection "copy-vault-$BUCKET" "copy-vault-hourly-v2"             '{"duration_s":600,"max_vaults":20,"vault_shard_count":1,"vault_shard_index":0,"rotate_mb":64}'
          if [ "$(date -u +%H)" = "06" ]; then
            make_campaign official_archive_collection "archives-binance-btc-$(date -u +%Y%m%d)" "archives-daily-v2"               "{\"venue\":\"binance\",\"coin\":\"BTC\",\"symbol\":\"BTCUSDT\",\"start_date\":\"$PREV_DAY\",\"end_date\":\"$PREV_DAY\",\"max_days\":1}"
            make_campaign official_archive_collection "archives-bybit-btc-$(date -u +%Y%m%d)" "archives-daily-v2"               "{\"venue\":\"bybit\",\"coin\":\"BTC\",\"symbol\":\"BTCUSDT\",\"start_date\":\"$PREV_DAY\",\"end_date\":\"$PREV_DAY\",\"max_days\":1}"
          fi
          make_campaign event_intelligence_collection "event-$BUCKET" "event-hourly-v2" '{}'
          make_campaign replay "replay-$BUCKET" "replay-safe-generation-v2" '{}'
          make_campaign backtest "backtest-$(date -u +%Y%m%d)" "backtest-daily-v2" '{}'
          make_campaign module_pnl_proof "pnl-$(date -u +%Y%m%d)" "pnl-daily-v2" '{}'
      - name: Commit campaign manifests
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/campaigns
          git diff --cached --quiet && exit 0
          git commit -m "campaign: create deterministic resumable work"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
