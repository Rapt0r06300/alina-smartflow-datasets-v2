name: create-resumable-campaigns
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-resumable-campaigns.yml'
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resumable-campaign-creation
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Checkout current campaign code and pin exact SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Rapt0r06300/hyperliquid-smart-wallet-observer
          ref: main
          path: alina
          persist-credentials: false

      - name: Create deterministic frozen campaigns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog/campaigns
          BUCKET="$(date -u +%Y%m%d%H)"
          DAY="$(date -u +%Y%m%d)"
          HOUR="$(date -u +%H)"
          SLOT6="$((10#$HOUR / 6))"
          PREV_DAY="$(date -u -d 'yesterday' +%Y-%m-%d)"
          NOW_MS="$(($(date -u +%s) * 1000))"
          REPLAY_START_MS="$((NOW_MS - 6 * 60 * 60 * 1000))"
          ECON_START_MS="$((NOW_MS - 7 * 24 * 60 * 60 * 1000))"
          CODE_SHA="$(git -C alina rev-parse HEAD)"
          PLAN_SHA="$(printf '%s' 'resumable-github-campaigns-v4' | sha256sum | cut -d' ' -f1)"

          make_campaign() {
            KIND="$1"
            ID="$2"
            CFG_TEXT="$3"
            CURSOR="$4"
            P="catalog/campaigns/$ID.json"
            CFG_SHA="$(printf '%s' "$CFG_TEXT|$CURSOR" | sha256sum | cut -d' ' -f1)"
            if [ ! -f "$P" ]; then
              PYTHONPATH=alina/src python alina/tools/resumable_campaign.py create "$P"                 --campaign-id "$ID"                 --kind "$KIND"                 --code-sha "$CODE_SHA"                 --dataset-generation V2_FRESH                 --config-sha256 "$CFG_SHA"                 --work-plan-sha256 "$PLAN_SHA"                 --cursor-json "$CURSOR"
            fi
          }

          make_campaign             market_collection             "market-$BUCKET-v4"             "market-hourly-continuous-v4"             '{"coins":"BTC,ETH,SOL,XRP,DOGE,BNB,AVAX,LINK,SUI,ADA,TRX,TON,WIF,ARB,OP,APT","duration_s":3500,"rotate_mb":64}'

          make_campaign             copy_vault_collection             "copy-vault-$BUCKET-v4"             "copy-vault-hourly-continuous-v4"             '{"duration_s":3500,"max_vaults":20,"vault_shard_count":1,"vault_shard_index":0,"rotate_mb":64}'

          make_campaign             event_intelligence_collection             "event-$BUCKET-v4"             "event-hourly-v4"             '{}'

          make_campaign             replay             "replay-$BUCKET-v4"             "replay-hourly-safe-v4"             "{\"start_ts_ms\":$REPLAY_START_MS,\"end_ts_ms\":$NOW_MS,\"max_shards\":64}"

          if [ "$((10#$HOUR % 6))" -eq 0 ]; then
            make_campaign               backtest               "backtest-$DAY-s$SLOT6-v4"               "backtest-six-hourly-safe-v4"               "{\"start_ts_ms\":$ECON_START_MS,\"end_ts_ms\":$NOW_MS,\"max_shards\":128}"
            make_campaign               module_pnl_proof               "pnl-$DAY-s$SLOT6-v4"               "pnl-six-hourly-safe-v4"               "{\"start_ts_ms\":$ECON_START_MS,\"end_ts_ms\":$NOW_MS,\"max_shards\":128}"
          fi

          if [ "$HOUR" = "06" ]; then
            make_campaign               official_archive_collection               "archives-binance-btc-$DAY-v4"               "archives-daily-v4"               "{\"venue\":\"binance\",\"coin\":\"BTC\",\"symbol\":\"BTCUSDT\",\"start_date\":\"$PREV_DAY\",\"end_date\":\"$PREV_DAY\",\"max_days\":1}"
            make_campaign               official_archive_collection               "archives-bybit-btc-$DAY-v4"               "archives-daily-v4"               "{\"venue\":\"bybit\",\"coin\":\"BTC\",\"symbol\":\"BTCUSDT\",\"start_date\":\"$PREV_DAY\",\"end_date\":\"$PREV_DAY\",\"max_days\":1}"
          fi

      - name: Commit campaign manifests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/campaigns
          git diff --cached --quiet && exit 0
          git commit -m "campaign: create continuous resumable work"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i*2))
          done
          exit 1


  launch:
    needs: create
    uses: ./.github/workflows/resumable-campaign-controller.yml
    permissions:
      contents: write
